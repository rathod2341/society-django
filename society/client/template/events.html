{% extends 'header.html' %}
{% load static %}

{% block content %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
	  <div class="container-full">
		<!-- Content Header (Page header) -->
		<div class="content-header">
			<div class="d-flex align-items-center">
				<div class="me-auto">
					<h3 class="page-title">Events </h3>
					<div class="d-inline-block align-items-center">
						<nav>
							<ol class="breadcrumb">
						
								
								
						</nav>
					</div>
				</div>
				
			</div>
		</div>

		<!-- Main content -->
		<section class="content">
			<div class="row">	

			  <div class="col-12">			
				<div class="card">
				  <div class="card-header">
					<h4 class="card-title">Society Events</h4>
				  </div>
				</div>
			  </div>	
			
			<!--card deck!-->
			<div class="col-12 mb-20">
				<div class="row row-cols-1 row-cols-lg-3 g-4">
					{% for data in ev %}
					<div class="col">
						<div class="card h-p100">
							<img class="card-img-top" src="{{data.cover_image.url}}" alt="card image cap" style="height: 300px;">
							<div class="card-body">
							  <h4 class="card-title b-0 px-0">{{data.event_name}}</h4>
							
								<p> Description: {{data.description}} </p>
								 Event Date : {{data.event_date}}
								 Event Time : {{data.event_time}}
</p>
							</div>
						
						    <div class="card-footer justify-content-between d-flex">
								<span class="text-muted">Last updated 3 mins ago</span>
								<span>
									<i class="fa fa-star text-warning"></i>
									<i class="fa fa-star text-warning"></i>
									<i class="fa fa-star text-warning"></i>
									<i class="fa fa-star text-warning"></i>
									<i class="fa fa-star-half text-warning"></i>
									<span class="text-muted ms-2">(12)</span>
								</span>
						    </div>
						</div>
					</div>
						{% endfor %}
					
				</div>
			</div>

			  

			


			 
			
				
			</div>
		</section>
		<!-- /.content -->
	  </div>
  </div>
  <!-- /.content-wrapper -->
   {% endblock %}
