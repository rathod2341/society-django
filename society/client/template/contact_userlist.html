{% extends 'header.html' %}
{% load static %}

{% block content %}

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
	  <div class="container-full">
		<!-- Content Header (Page header) -->	  
		<div class="content-header">
			<div class="d-flex align-items-center">
				<div class="me-auto">
					<h3 class="page-title">User list</h3>
					<div class="d-inline-block align-items-center">
						<nav>
							<ol class="breadcrumb">
								<li class="breadcrumb-item"><a href="#"><i class="mdi mdi-home-outline"></i></a></li>
								<li class="breadcrumb-item" aria-current="page">Contact</li>
								<li class="breadcrumb-item active" aria-current="page">User list</li>
								<li class="breadcrumb-item active" aria-current="page"><a href="/add_family/" class="btn btn-primary"> Add Family Members</a></li>

							</ol>
						</nav>
					</div>
				</div>
				
			</div>
		</div>  

		<!-- Main content -->
		<section class="content">
			<div class="row">				
				<div class="col-lg-12 col-md-8">
					<div class="box">
					  <div class="media-list media-list-divided media-list-hover">
					
						{% for data in fm  %}
						<div class="media align-items-center">
						  

						  <div class="media-body">
							<p>
							  <a href="#"><strong>{{data.name}}</strong></a>
							  <small class="sidetitle">{{data.relation}}</small>
							</p>
							<p>{{data.contact}}</p>

							<nav class="nav mt-2">
								<a href="/delete_family/{{data.family_member_id}}"><span style="color: red;">Delete</span></a>
							</nav>
						  </div>

						  <div class="media-right gap-items">
							
							<div class="btn-group">
							  <a class="media-action lead" href="#" data-bs-toggle="dropdown"><i class="ion-android-more-vertical"></i></a>
							  <div class="dropdown-menu dropdown-menu-end">
								<a class="dropdown-item" href="#"><i class="fa fa-fw fa-user"></i> Profile</a>
								<a class="dropdown-item" href="#"><i class="fa fa-fw fa-comments"></i> Messages</a>
								<a class="dropdown-item" href="#"><i class="fa fa-fw fa-phone"></i> Call</a>
								<div class="dropdown-divider"></div>
								<a class="dropdown-item" href="#"><i class="fa fa-fw fa-remove"></i> Remove</a>
							  </div>
							</div>

						  </div>
						</div>
						{% endfor %}
					

					  </div>
					</div>
				</div>
						
			</div>
		</section>
		<!-- /.content -->
	  </div>	  
  </div>
  <!-- /.content-wrapper -->
	


{% endblock %}
