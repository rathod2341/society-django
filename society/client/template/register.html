<!DOCTYPE html>
{% load static %}
<html lang="en">

<!-- Mirrored from warehouse-admin-dashboard.multipurposethemes.com/main-horizontal/auth_register.html by HTTrack Website Copier/3.x [XR&CO'2014], Sun, 21 Jun 2026 06:02:36 GMT -->
<head> 
  <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="https://warehouse-admin-dashboard.multipurposethemes.com/images/favicon.ico">

    <title>Deposito Admin - Registration </title>
  
	<!-- Vendors Style-->
	<link rel="stylesheet" href="{% static 'css/vendors_css.css' %}">
	  
	<!-- Style-->    
	<link rel="stylesheet" href="{% static 'css/horizontal-menu.css' %}"> 
	<link rel="stylesheet" href="{% static 'css/style.css' %}"> 
	<link rel="stylesheet" href="{% static 'css/skin_color.css' %}">	

</head>

<body class="hold-transition theme-primary bg-img"
style="background-image: url('/static/images/auth-bg/bg-1.jpg')" >
	
	<div class="container h-p100">
		<div class="row align-items-center justify-content-md-center h-p100">
			
			<div class="col-12">
				<div class="row justify-content-center g-0">
					<div class="col-lg-5 col-md-5 col-12">
						<div class="bg-white rounded10 shadow-lg">
							<div class="content-top-agile p-20 pb-0">
								<h2 class="text-primary">Get started with Us</h2>
								<p class="mb-0">Register a new membership</p>							
							</div>
							<div class="p-40">
								<form action="/register/" method="post">
									{% csrf_token %}
									<div class="form-group">
										<div class="input-group mb-3">
											<span class="input-group-text bg-transparent"><i class="ti-member_name"></i></span>
											<input type="text" name="member_name" class="form-control ps-15 bg-transparent" placeholder="membername">
										</div>
									</div>
									 <div class="form-group">
											<div class="input-group mb-3">
											<span class="input-group-text bg-transparent"><i class="ti-contact"></i></span>
											<input type="text" name="contact" class="form-control ps-15 bg-transparent" placeholder="contact">
										</div>
									</div>
									<div class="form-group">
										<div class="input-group mb-3">
											<span class="input-group-text bg-transparent"><i class="ti-email"></i></span>
											<input type="email" name="email" class="form-control ps-15 bg-transparent" placeholder="email">
										</div>
									</div>
									<div class="form-group">
										<div class="input-group mb-3">
											<span class="input-group-text bg-transparent"><i class="ti-password"></i></span>
											<input type="text" name="password" class="form-control ps-15 bg-transparent" placeholder="password">
										</div>
									</div>
								
									<div class="form-group">
										<div class="input-group mb-3">
											<!-- <span class="input-group-text bg-transparent"><i class="ti-is_rented"></i></span>
											<input type="text" name="is_rented" class="form-control ps-15 bg-transparent" placeholder="is_rented"> -->

											<select name="is_rented" class="form-control ps-15 bg-transparent">
												<option value=True>Rented</option>	
												<option value=False>Owner</option>
											</select>

										</div>
									</div>
									
									
									<div class="form-group">
										<div class="input-group mb-3">
											<span class="input-group-text bg-transparent"><i class="ti-profile_photo"></i></span>
											<input type="file" name="profile_photo" class="form-control ps-15 bg-transparent" placeholder="profile_photo">
										</div>
									</div>
									
								
									  <div class="row">
										
										<div class="col-12 text-center">
										  <button type="submit" class="btn btn-info margin-top-10">SIGN IN</button>
										</div>
										<!-- /.col -->
									  </div>
								</form>				
								<div class="text-center">
									<p class="mt-15 mb-0">Already have an account?<a href="/login/" class="text-danger ms-5"> Sign In</a></p>
								</div>
							</div>
						</div>								

						
					</div>
				</div>
			</div>			
		</div>
	</div>


	<!-- Vendor JS -->
	<script src="{% static 'js/vendors.min.js' %}"></script>
	<script src="{% static 'js/pages/chat-popup.js' %}"></script>
    <script src="{% static 'assets/icons/feather-icons/feather.min.js' %}"></script>	
	
	
</body>

</html>
