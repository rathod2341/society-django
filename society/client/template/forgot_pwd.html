<!DOCTYPE html>

{% load static %}
<html lang="en">

<!-- Mirrored from warehouse-admin-dashboard.multipurposethemes.com/main-horizontal/auth_login.html by HTTrack Website Copier/3.x [XR&CO'2014], Sun, 21 Jun 2026 06:01:44 GMT -->
<head>
  <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="https://warehouse-admin-dashboard.multipurposethemes.com/images/favicon.ico">

    <title>HomeHieve - Log in </title>
  
	<!-- Vendors Style-->
	<link rel="stylesheet" href="{% static 'css/vendors_css.css' %}">
	  
	<!-- Style-->    
	<link rel="stylesheet" href="{% static 'css/horizontal-menu.css' %}"> 
	<link rel="stylesheet" href="{% static 'css/style.css' %}">
	<link rel="stylesheet" href="{% static 'css/skin_color.css' %}">	

</head>
	
<body class="hold-transition theme-primary bg-img" 
	style="background-image: url('/static/images/auth-bg/bg-1.jpg')">
	<div class="container h-p100">
		<div class="row align-items-center justify-content-md-center h-p100">	
			
			<div class="col-12">
				<div class="row justify-content-center g-0">
					<div class="col-lg-5 col-md-5 col-12">
						<div class="bg-white rounded10 shadow-lg">
							<div class="content-top-agile p-20 pb-0">
								<h2 class="text-primary">Change Your Password</h2>
								<p class="mb-0">Sign in to continue to HomeHieve</p>							
							</div>
							<div class="p-40">
								<form action="/send_otp/" method="post">
									{% csrf_token %}
									<div class="form-group">
										<div class="input-group mb-3">
											<span class="input-group-text bg-transparent"><i class="ti-user"></i></span>
											<input type="text" class="form-control ps-15 bg-transparent" placeholder="enter your email" name="email">
										</div>
									</div>
									<div class="form-group">
										
									  <div class="row">
										
										</div>
										
										 
										<div class="col-12 text-center">
										  	<button type="submit" class="btn btn-danger mt-10">Send Otp</button>
										</div>
										
									  </div>
								</form>	
								
							</div>						
						</div>
						
					</div>
				</div>
			</div>
		</div>
	</div>


	<!-- Vendor JS -->
	<script src="{% static 'js/vendors.min.js' %}"></script>
	<script src="{% static 'js/pages/chat-popup.js' %}"></script>
    <script src="{% static 'assets/icons/feather-icons/feather.min.js' %}"></script>	

</body>

<!-- Mirrored from warehouse-admin-dashboard.multipurposethemes.com/main-horizontal/auth_login.html by HTTrack Website Copier/3.x [XR&CO'2014], Sun, 21 Jun 2026 06:01:44 GMT -->
</html>
