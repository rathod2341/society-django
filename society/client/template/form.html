{% extends 'header.html' %}
{% load static %}

{% block content %}
  
  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
	  <div class="container-full">
		<!-- Content Header (Page header) -->
		<div class="content-header">
			<div class="d-flex align-items-center">
				<div class="me-auto">   
					<h3 class="page-title">Add Complaint</h3>
					<div class="d-inline-block align-items-center">
						<!-- <nav>
							<ol class="breadcrumb">
								<li class="breadcrumb-item"><a href="#"><i class="mdi mdi-home-outline"></i></a></li>
								<li class="breadcrumb-item" aria-current="page">Forms</li>
								<li class="breadcrumb-item active" aria-current="page">Form Validation</li>
							</ol>
						</nav> -->
					</div>
				</div>
				
			</div>
		</div>	  

		<!-- Main content -->
	<section class="content">

		 <!-- Basic Forms -->
		  <div class="box">
			<div class="box-header with-border">
			  <h4 class="box-title">ADD Complain</h4>
			  <h6 class="box-subtitle">Add your complain here to manage better</h6>
			</div>
			<!-- /.box-header -->
			<div class="box-body">
			  <div class="row">
				<div class="col">
					<form method="POST">
						{% csrf_token %}
					  <div class="row">
						<div class="col-12">						
							<div class="form-group">
								<h5>Complain Title <span class="text-danger">*</span></h5>
								<div class="controls">
									<input type="text" name="title" class="form-control" required data-validation-required-message="This field is required"> 
								</div>
			
							</div>
							<div class="form-group">
								<h5>Description <span class="text-danger">*</span></h5>
								<div class="controls">
									<textarea name="description" id="textarea" class="form-control" required placeholder="Textarea text"></textarea>
								</div>
							</div>
						</div>
					  </div>
			
						<div class="text-xs-right">
							<button type="submit" class="btn btn-info">Submit</button>
						</div>
					</form>

				</div>
				<!-- /.col -->
			  </div>
			  <!-- /.row -->
			</div>
			<!-- /.box-body -->
		  </div>
		  <!-- /.box -->

		</section>		
		
		<!-- /.content -->
	  </div>
  </div>
  <!-- /.content-wrapper -->
  
   {% endblock %}
